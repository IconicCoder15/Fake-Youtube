<!DOCTYPE html>
<html>
  <head>
    <title>GRID PRACTICE</title>
  </head>
  <body style="padding-bottom: 1000px;">
    <div style="
      display: grid;
      grid-template-columns: 100px 100px;
      ">
      <div style="background-color:magenta;">div 1</div>
      <div style="background-color:cyan;">div 2</div>
    </div>
      <div style="
      margin-top: 30px;
      display: grid;
       grid-template-columns: 100px 100px 200px;
      ">
      <div style="background-color:magenta;">div 1</div>
      <div style="background-color:cyan;">div 2</div>
      <div style="background-color:magenta;">div 3</div>
      <div style="background-color:magenta;">div 4</div>
      </div>  
        <div style="
        margin-top: 30px;
        display: grid;
        grid-template-columns: 100px 1fr;
        ">
        <div style="background-color:magenta;">div 1</div>
        <div style="background-color:cyan;">div 2</div>
        </div> 
          <div style="
          margin-top: 30px;
          display: grid;
          grid-template-columns: 100px 1fr 2fr;
          ">
          <div style="background-color:magenta;">div 1</div>
          <div style="background-color:cyan;">div 2</div>
          <div style="background-color:magenta;">div 1</div>
          </div>

          <div style="
            margin-top: 30px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            column-gap: 20px;
            row-gap: 50px;
            ">
            <div style="background-color:magenta; height:200px;">div 1</div>
            <div style="background-color:cyan; height:200px;">div 2</div>
            <div style="background-color:pink; height:200px;;">div 1</div>
            <div style="background-color:cyan; height:200px;">div 2</div>
            <div style="background-color:pink; height:200px;">div 1</div>
            <div style="background-color:magenta; height:200px;;">div 1</div>
            </div>
    </body>
</html>
