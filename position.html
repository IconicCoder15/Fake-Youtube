<!DOCTYPE html>
<html>
  <head>
    <title>Position Practice
    </title>
  </head>
  <body style="padding-bottom: 3000px;
      padding-top: 60px;
      padding-left: 80px;
  ">
    <div style="
      background-color: black;
      color: white;
      position: fixed;
      top: 0px;
      left: 0px;
      right: 0px;
      height: 50px;
      ">Header</div>

      <div style="
      background-color: navy;
       color: white;
       position: fixed; 
       bottom: 0px;
       left: 0px;
       top: 50px;
       width: 70px;
      ">
        Sidebar
        
      <div style="
      position: absolute;
      background-color: darkgreen;
      color: white;
      right: 0px;
      top: 0px;
      ">
      X
      </div>
      </div>

      <div style="
      position: absolute;
      background-color: darkgreen;
      color: white;
      right: 10px;
      top: 50px;
      ">
      Absolute
      </div>

    <div style="
      background-color: cyan;
      height: 200px;
      width: 200px;
      position: static;
      ">Div 1</div>
    <div style="
    background-color: magenta;
    height: 200px;
    width: 200px;
    position: relative;
    ">
    Div 2
      
      <div style="
      position: absolute;
      background-color: black;
      color: white;
      right: 10px;
      bottom: 10px;
      ">
      3:25
      </div>  
  </div>
  </body>
</html>
